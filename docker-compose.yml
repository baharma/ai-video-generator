services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      VITE_APP_NAME: "${APP_NAME:-AI Video Generator}"
      VITE_APP_URL: "https://video-ai.baharma.my.id"
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-video_streaming}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-video_streaming}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -u
        - root
        - -p${DB_PASSWORD:-password}
      interval: 5s
      timeout: 5s
      retries: 20

  vite:
    image: node:22-bookworm
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - npm-cache:/root/.npm
    environment:
      VITE_APP_NAME: "${APP_NAME:-Laravel}"
    command: sh docker/vite-entrypoint.sh
    depends_on:
      - app

volumes:
  composer-cache:
  mysql-data:
  npm-cache:
